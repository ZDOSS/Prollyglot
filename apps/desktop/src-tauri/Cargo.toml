[package]
name = "prollyglot-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "prollyglot_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
crossbeam-channel.workspace = true
parking_lot.workspace = true
prollyglot-application-runtime = { path = "../../../crates/application-runtime" }
prollyglot-asr = { path = "../../../crates/asr" }
prollyglot-asr-sherpa = { path = "../../../crates/asr-sherpa" }
prollyglot-audio-pipeline = { path = "../../../crates/audio-pipeline" }
prollyglot-audio-windows = { path = "../../../crates/audio-windows" }
prollyglot-config = { path = "../../../crates/config" }
prollyglot-core = { path = "../../../crates/prollyglot-core" }
prollyglot-model-manager = { path = "../../../crates/model-manager" }
prollyglot-resource-coordinator = { path = "../../../crates/resource-coordinator" }
prollyglot-transcript = { path = "../../../crates/transcript" }
prollyglot-visual-ocr-rapid = { path = "../../../crates/visual-ocr-rapid" }
prollyglot-visual-pipeline = { path = "../../../crates/visual-pipeline" }
prollyglot-visual-windows = { path = "../../../crates/visual-windows" }
serde.workspace = true
tauri.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
