[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/audio-pipeline",
    "crates/audio-windows",
    "crates/prollyglot-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ZDOSS/Prollyglot"

[workspace.dependencies]
crossbeam-channel = "0.5.16"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
windows = "0.62.2"
