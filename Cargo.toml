[workspace]
resolver = "3"
exclude = ["vendor/rapidocr-core"]
members = [
    "apps/desktop/src-tauri",
    "crates/application-runtime",
    "crates/asr",
    "crates/asr-sherpa",
    "crates/audio-pipeline",
    "crates/audio-windows",
    "crates/config",
    "crates/model-manager",
    "crates/prollyglot-core",
    "crates/resource-coordinator",
    "crates/transcript",
    "crates/visual-pipeline",
    "crates/visual-ocr-rapid",
    "crates/visual-windows",
]

[workspace.package]
version = "0.1.12"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ZDOSS/Prollyglot"

[workspace.dependencies]
crossbeam-channel = "0.5.16"
image = { version = "0.25.9", default-features = false }
parking_lot = "0.12.5"
rapidocr-core = { path = "vendor/rapidocr-core", default-features = false }
rubato = { version = "4.0.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
sherpa-onnx = { version = "1.13.4", default-features = false }
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
ts-rs = "12.0.1"
ureq = { version = "3.4.0", default-features = false }
windows = "0.62.2"
windows-capture = "=2.0.1"

# `tauri dev` is the owner's normal Windows test loop. Keep the UI and most
# application crates quick to rebuild, but optimize the CPU-heavy OCR path so
# development builds do not turn image conversion and DB postprocessing into
# multi-second work that would not represent a release build.
[profile.dev.package.rapidocr-core]
opt-level = 3

[profile.dev.package.prollyglot-visual-ocr-rapid]
opt-level = 3

[profile.dev.package.prollyglot-visual-pipeline]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.imageproc]
opt-level = 3

[profile.dev.package.ndarray]
opt-level = 3
